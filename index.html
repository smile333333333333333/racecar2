<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Zombie Highway</title>
<style>
*{box-sizing:border-box;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#294c2b}
#game{position:relative;width:100vw;height:100vh;overflow:hidden}
#road{position:absolute;left:5%;width:90%;height:100%;overflow:hidden;background:#444;border-left:11px solid #aaa;border-right:11px solid #aaa}
.line{position:absolute;width:6px;height:100px;background:white;opacity:.85}
.l1{left:33.3%}.l2{left:66.6%}

#player{
 position:absolute;width:52px;height:88px;left:50%;bottom:65px;
 transform:translateX(-50%);background:#246fd0;border-radius:10px;
 z-index:50;box-shadow:0 5px 12px #111
}
.pwin{position:absolute;width:38px;height:27px;left:7px;top:10px;background:#9ed7e8;border-radius:6px}
.pstripe{position:absolute;width:40px;height:5px;left:6px;top:42px;background:#ffffff55}
.wheel{position:absolute;width:10px;height:27px;top:20px;background:#111;border-radius:4px}
.wheel.left{left:-7px}.wheel.right{right:-7px}
.light{position:absolute;width:10px;height:7px;bottom:5px;background:white;border-radius:2px}
.light.left{left:7px}.light.right{right:7px}

.car,.wreck{
 position:absolute;transform:translateX(-50%);z-index:25;
 border-radius:8px;box-shadow:0 4px 8px #111
}
.car{width:48px;height:84px}
.wreck{width:54px;height:82px;background:#292929;transform:translateX(-50%) rotate(-7deg)}
.cwin{position:absolute;width:34px;height:25px;left:7px;top:9px;background:#a7d7e5;border-radius:5px}
.cwheel{position:absolute;width:9px;height:25px;top:19px;background:#111;border-radius:3px}
.cwheel.left{left:-6px}.cwheel.right{right:-6px}

.zombie{
 position:absolute;width:36px;height:55px;
 transform:translateX(-50%);z-index:35
}
.zhead{position:absolute;width:26px;height:26px;left:5px;border-radius:50%;background:#719d5a}
.zbody{position:absolute;width:31px;height:30px;left:2px;top:22px;border-radius:8px;background:#526c4b}
.eye{position:absolute;width:4px;height:4px;top:10px;background:#111;border-radius:50%;z-index:2}
.eye.left{left:7px}.eye.right{right:7px}
.arm{position:absolute;width:7px;height:24px;top:25px;background:#719d5a;border-radius:5px}
.arm.left{left:-5px;transform:rotate(25deg)}
.arm.right{right:-5px;transform:rotate(-25deg)}
.fast .zbody{background:#704b4b}
.bigZombie{transform:translateX(-50%) scale(1.25)}

.hordeMark{
 position:absolute;z-index:30;color:#fff;background:#0009;
 padding:5px 9px;border-radius:8px;font-weight:bold
}

.kit{
 position:absolute;width:32px;height:32px;background:white;
 border:3px solid #222;border-radius:6px;color:red;font-size:27px;
 font-weight:bold;text-align:center;line-height:25px;z-index:35
}

.bigObstacle{
 position:absolute;width:75%;height:105px;left:50%;
 transform:translateX(-50%);
 background:#272727;border:5px solid #111;border-radius:15px;
 z-index:30;box-shadow:0 8px 15px #111
}
.bigObstacle:before{
 content:"BLOCKED";position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%) rotate(-4deg);
 color:#e5b52b;font-size:25px;font-weight:bold;
 border:4px solid #e5b52b;padding:5px 14px
}

.scenery{position:absolute;z-index:3;pointer-events:none}
.tree{width:30px;height:55px}
.tree:before{content:"";position:absolute;left:12px;top:24px;width:7px;height:31px;background:#65432b}
.tree:after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:#285b2b;box-shadow:10px 7px 0 #326b31}
.sign{width:28px;height:42px}
.sign:before{content:"";position:absolute;left:12px;top:15px;width:4px;height:27px;background:#777}
.sign:after{content:"!";position:absolute;width:24px;height:20px;background:#e5b52b;color:#111;text-align:center;font-weight:bold;line-height:20px;border:2px solid #222}

#hud{
 position:absolute;top:10px;left:10px;z-index:100;color:white;
 font-weight:bold;font-size:15px;line-height:1.6;text-shadow:2px 2px 4px #000
}
#health{display:inline-block;width:140px;height:18px;vertical-align:middle;border:2px solid white;border-radius:5px;overflow:hidden;background:#222}
#healthFill{width:100%;height:100%;background:#31c852}
#combo{color:#ffd83d}

#blood{
 position:absolute;inset:0;z-index:80;pointer-events:none;opacity:0;
 background:
 radial-gradient(circle at 5% 5%,#900b,transparent 18%),
 radial-gradient(circle at 95% 5%,#900b,transparent 18%),
 radial-gradient(circle at 5% 95%,#900b,transparent 18%),
 radial-gradient(circle at 95% 95%,#900b,transparent 18%)
}
#flash{position:absolute;inset:0;z-index:85;pointer-events:none;background:#d00a;opacity:0}
#msg{
 position:absolute;top:105px;left:50%;transform:translateX(-50%);
 z-index:120;color:white;background:#000b;padding:8px 14px;
 border-radius:10px;font-weight:bold;opacity:0
}

#controls{
 position:absolute;bottom:16px;left:50%;
 transform:translateX(-50%);display:flex;gap:20px;z-index:130
}
.control{
 width:85px;height:62px;display:flex;justify-content:center;
 align-items:center;color:white;background:#0009;border:2px solid white;
 border-radius:12px;font-size:32px;touch-action:none
}

.screen{
 position:absolute;inset:0;z-index:300;display:flex;
 flex-direction:column;justify-content:center;align-items:center;
 text-align:center;color:white;background:#000d;padding:25px
}
.screen h1{margin:0 0 10px;font-size:40px;letter-spacing:3px}
.screen p{max-width:480px;line-height:1.5}
button{
 border:0;border-radius:9px;padding:15px 34px;color:white;
 background:#1685ff;font-size:20px;font-weight:bold
}
.hidden{display:none!important}
</style>
</head>

<body>
<div id="game">

<div id="road"></div>

<div id="player">
 <div class="pwin"></div>
 <div class="pstripe"></div>
 <div class="wheel left"></div>
 <div class="wheel right"></div>
 <div class="light left"></div>
 <div class="light right"></div>
</div>

<div id="hud">
 HEALTH: <div id="health"><div id="healthFill"></div></div>
 <br>DISTANCE: <span id="distance">0</span> m
 <br>SCORE: <span id="score">0</span>
 <br>COMBO: <span id="combo">x1</span>
</div>

<div id="blood"></div>
<div id="flash"></div>
<div id="msg"></div>

<div id="controls">
 <div class="control" id="leftBtn">◀</div>
 <div class="control" id="rightBtn">▶</div>
</div>

<div id="start" class="screen">
 <h1>ZOMBIE HIGHWAY</h1>
 <p>
 The outbreak has reached the highway.
 <br><br>
 Dodge traffic, survive zombie groups,
 collect health kits and watch for massive hordes.
 <br><br>
 <b>Some obstacles are HUGE.</b>
 <br><br>
 A/D, arrow keys, or touch controls.
 </p>
 <button id="startBtn">START DRIVING</button>
</div>

<div id="gameover" class="screen hidden">
 <h1>GAME OVER</h1>
 <p>
 Distance: <b><span id="finalDistance">0</span> m</b>
 <br>
 Score: <b><span id="finalScore">0</span></b>
 <br>
 Best: <b><span id="finalBest">0</span></b>
 </p>
 <button id="restartBtn">DRIVE AGAIN</button>
</div>

</div>

<script>
const road=document.getElementById("road");
const player=document.getElementById("player");
const healthFill=document.getElementById("healthFill");
const distanceText=document.getElementById("distance");
const scoreText=document.getElementById("score");
const comboText=document.getElementById("combo");
const blood=document.getElementById("blood");
const flash=document.getElementById("flash");
const msg=document.getElementById("msg");

let running=false,last=0,x=0,steer=0;
let health=100,distance=0,score=0,combo=1;
let comboTime=0,best=0,difficulty=1;
let objects=[],lines=[],scenery=[];
let trafficTimer=0,zombieTimer=0,wreckTimer=0;
let kitTimer=0,sceneTimer=0,hordeTimer=0,bigTimer=0;

const SPEED=12;


/* ROAD */

function makeRoad(){
 for(let i=0;i<15;i++){
  for(let c of ["l1","l2"]){
   let e=document.createElement("div");
   e.className="line "+c;
   e.style.top=(i*115-120)+"px";
   road.appendChild(e);
   lines.push(e);
  }
 }
}

function moveRoad(d){
 for(let e of lines){
  let y=parseFloat(e.style.top)+SPEED*d;
  if(y>innerHeight+120)y=-120;
  e.style.top=y+"px";
 }
}


/* PLAYER */

function movePlayer(d){
 if(steer)x+=steer*1.75*d;

 let limit=road.clientWidth/2-40;
 x=Math.max(-limit,Math.min(limit,x));

 player.style.left=`calc(50% + ${x}px)`;
}


/* COLLISION */

function hit(a,b){
 let A=a.getBoundingClientRect();
 let B=b.getBoundingClientRect();

 return !(
  A.right<B.left+5 ||
  A.left>B.right-5 ||
  A.bottom<B.top+5 ||
  A.top>B.bottom-5
 );
}


/* NORMAL CAR */

function createCar(){

 let e=document.createElement("div");
 e.className="car";

 e.style.background=[
  "#d93434","#eee","#222","#d9ad29",
  "#29964f","#7545c2","#e87820","#277cc9"
 ][Math.floor(Math.random()*8)];

 e.innerHTML=
 '<div class="cwin"></div>'+
 '<div class="cwheel left"></div>'+
 '<div class="cwheel right"></div>';

 addObject(e,"car");
}


/* WRECK */

function createWreck(){

 let e=document.createElement("div");
 e.className="wreck";

 e.innerHTML=
 '<div class="cwin"></div>'+
 '<div style="position:absolute;width:38px;height:6px;left:8px;top:43px;background:#111;transform:rotate(10deg)"></div>';

 addObject(e,"wreck");
}


/* ZOMBIE */

function createZombie(xPos=null){

 let e=document.createElement("div");
 e.className="zombie";

 let r=Math.random();

 if(r<.12)e.classList.add("bigZombie");
 else if(r<.35)e.classList.add("fast");

 e.innerHTML=
 '<div class="zhead"></div>'+
 '<div class="zbody"></div>'+
 '<div class="eye left"></div>'+
 '<div class="eye right"></div>'+
 '<div class="arm left"></div>'+
 '<div class="arm right"></div>';

 addObject(
  e,
  "zombie",
  e.classList.contains("fast")?1.2:1,
  xPos
 );
}


/* GROUP OF ZOMBIES */

function createGroup(){

 let count=3+Math.floor(Math.random()*3);

 let center=40+Math.random()*(road.clientWidth-80);

 for(let i=0;i<count;i++){

  let pos=center+(Math.random()-.5)*120;

  pos=Math.max(30,Math.min(road.clientWidth-30,pos));

  createZombie(pos);
 }

 say("ZOMBIE GROUP!");
}


/* MASSIVE HORDE */

function createHorde(){

 let count=9+Math.floor(Math.random()*8);

 for(let i=0;i<count;i++){

  let pos=25+Math.random()*(road.clientWidth-50);

  createZombie(pos);

  if(Math.random()<.25)
   createZombie(
    Math.max(20,Math.min(road.clientWidth-20,pos+25))
   );
 }

 say("MASSIVE HORDE!");
}


/* BIG OBSTACLE */

function createBigObstacle(){

 let e=document.createElement("div");
 e.className="bigObstacle";

 e.style.top="-130px";

 road.appendChild(e);

 objects.push({
  e:e,
  type:"big",
  x:road.clientWidth/2,
  y:-130,
  mult:.9,
  hit:false
 });

 say("HUGE OBSTACLE!");
}


/* HEALTH KIT */

function createKit(){

 let e=document.createElement("div");
 e.className="kit";
 e.textContent="+";

 addObject(e,"kit");
}


/* ADD OBJECT */

function addObject(e,type,mult=1,xPos=null){

 let pos=xPos===null
  ?35+Math.random()*(road.clientWidth-70)
  :xPos;

 e.style.left=pos+"px";
 e.style.top="-100px";

 road.appendChild(e);

 objects.push({
  e:e,type:type,x:pos,y:-100,
  mult:mult,hit:false
 });
}


/* SCENERY */

function createScenery(){

 let e=document.createElement("div");
 let r=Math.random();

 e.className=
  "scenery "+(r<.65?"tree":"sign");

 e.style.left=
  (Math.random()<.5
   ?2+Math.random()*7
   :91+Math.random()*7)+"vw";

 e.style.top="-80px";

 game.appendChild(e);

 scenery.push({e:e,y:-80});
}

function moveScenery(d){

 for(let i=scenery.length-1;i>=0;i--){

  let s=scenery[i];
  s.y+=SPEED*d;
  s.e.style.top=s.y+"px";

  if(s.y>innerHeight+100){
   s.e.remove();
   scenery.splice(i,1);
  }
 }
}


/* HEALTH */

function updateHealth(){

 healthFill.style.width=health+"%";

 healthFill.style.background=
  health<=25?"#d22":
  health<=50?"#e0a52b":
  "#31c852";
}

function damage(n){

 health=Math.max(0,health-n);
 updateHealth();

 flash.style.opacity=".5";
 setTimeout(()=>flash.style.opacity="0",120);

 combo=1;
 comboTime=0;
 comboText.textContent="x1";

 if(health<=0)endGame();
}


/* MESSAGE */

function say(text){

 msg.textContent=text;
 msg.style.opacity="1";

 clearTimeout(say.timer);

 say.timer=setTimeout(()=>{
  msg.style.opacity="0";
 },900);
}


/* MOVE OBJECTS */

function moveObjects(d){

 for(let i=objects.length-1;i>=0;i--){

  let o=objects[i];

  o.y+=SPEED*d*o.mult;
  o.e.style.top=o.y+"px";

  if(!o.hit&&hit(player,o.e)){

   o.hit=true;

   if(o.type==="zombie"){

    combo=Math.min(12,combo+1);
    comboTime=180;

    let points=30*combo;

    if(o.e.classList.contains("bigZombie"))
     points+=30;

    score+=points;

    let current=parseFloat(blood.style.opacity)||0;
    blood.style.opacity=Math.min(.9,current+.13);

    comboText.textContent="x"+combo;
    say("+"+points);

    o.e.remove();
    objects.splice(i,1);
    continue;
   }

   if(o.type==="kit"){

    health=Math.min(100,health+25);
    score+=20;
    updateHealth();

    say("+25 HEALTH");

    o.e.remove();
    objects.splice(i,1);
    continue;
   }

   if(o.type==="big"){
    damage(30);
    say("HUGE OBSTACLE!");
   }
   else if(o.type==="wreck"){
    damage(20);
    say("WRECK!");
   }
   else{
    damage(10);
    say("CRASH!");
   }
  }

  if(!objects[i])continue;

  if(o.y>innerHeight+160){

   o.e.remove();
   objects.splice(i,1);
  }
 }
}


/* SPAWN SYSTEM */

function spawn(d){

 trafficTimer-=d;
 zombieTimer-=d;
 wreckTimer-=d;
 kitTimer-=d;
 sceneTimer-=d;
 hordeTimer-=d;
 bigTimer-=d;

 difficulty=1+Math.floor(distance/500)*.12;


 /* CARS */

 if(trafficTimer<=0){

  createCar();

  if(Math.random()<.25)
   setTimeout(()=>running&&createCar(),200);

  trafficTimer=
   Math.max(300,700-difficulty*30)+Math.random()*180;
 }


 /* ZOMBIES */

 if(zombieTimer<=0){

  let r=Math.random();

  if(r<.12)
   createHorde();
  else if(r<.40)
   createGroup();
  else
   createZombie();

  zombieTimer=
   Math.max(350,900-difficulty*35);
 }


 /* WRECKS */

 if(wreckTimer<=0){

  createWreck();

  wreckTimer=
   Math.max(1200,3000-difficulty*100);
 }


 /* HEALTH */

 if(kitTimer<=0){

  createKit();
  kitTimer=6500+Math.random()*4000;
 }


 /* HUGE OBSTACLE */

 if(bigTimer<=0){

  if(distance>300)
   createBigObstacle();

  bigTimer=
   9000+Math.random()*8000;
 }


 /* SCENERY */

 if(sceneTimer<=0){

  createScenery();
  sceneTimer=250+Math.random()*300;
 }
}


/* COMBO */

function updateCombo(d){

 if(comboTime>0){
  comboTime-=d;
 }
 else if(combo>1){

  combo=1;
  comboText.textContent="x1";
 }
}


/* LIGHTING */

function lighting(){

 let night=Math.floor(distance/800)%2;

 document.body.style.background=
  night?"#17231a":"#294c2b";

 road.style.background=
  night?"#303030":"#444";
}


/* GAME LOOP */

function loop(t){

 if(!running)return;

 if(!last)last=t;

 let d=(t-last)/16.67;

 if(d>3)d=3;

 last=t;

 distance+=SPEED*d*.1;

 moveRoad(d);
 movePlayer(d);
 moveObjects(d);
 moveScenery(d);
 spawn(d);
 updateCombo(d);
 lighting();

 distanceText.textContent=Math.floor(distance);
 scoreText.textContent=Math.floor(score);

 requestAnimationFrame(loop);
}


/* CLEAR */

function clearGame(){

 objects.forEach(o=>o.e.remove());
 scenery.forEach(s=>s.e.remove());

 objects=[];
 scenery=[];
}


/* START */

function startGame(){

 clearGame();

 health=100;
 distance=0;
 score=0;
 combo=1;
 comboTime=0;
 difficulty=1;

 x=0;
 steer=0;
 last=0;

 trafficTimer=100;
 zombieTimer=300;
 wreckTimer=1400;
 kitTimer=3500;
 sceneTimer=100;
 hordeTimer=5000;
 bigTimer=7000;

 healthFill.style.width="100%";
 healthFill.style.background="#31c852";

 blood.style.opacity="0";
 flash.style.opacity="0";

 player.style.left="50%";

 start.classList.add("hidden");
 gameover.classList.add("hidden");

 running=true;

 requestAnimationFrame(loop);
}


/* GAME OVER */

function endGame(){

 if(!running)return;

 running=false;

 best=Math.max(best,score);

 finalDistance.textContent=Math.floor(distance);
 finalScore.textContent=Math.floor(score);
 finalBest.textContent=Math.floor(best);

 gameover.classList.remove("hidden");
}


/* KEYBOARD */

document.addEventListener("keydown",e=>{

 let k=e.key.toLowerCase();

 if(e.key==="ArrowLeft"||k==="a")
  steer=-1;

 if(e.key==="ArrowRight"||k==="d")
  steer=1;
});

document.addEventListener("keyup",e=>{

 let k=e.key.toLowerCase();

 if(
  e.key==="ArrowLeft"||
  e.key==="ArrowRight"||
  k==="a"||k==="d"
 )steer=0;
});


/* TOUCH */

function stopSteer(){
 steer=0;
}

leftBtn.addEventListener("pointerdown",e=>{
 e.preventDefault();
 steer=-1;
});

rightBtn.addEventListener("pointerdown",e=>{
 e.preventDefault();
 steer=1;
});

leftBtn.addEventListener("pointerup",stopSteer);
leftBtn.addEventListener("pointercancel",stopSteer);
leftBtn.addEventListener("pointerleave",stopSteer);

rightBtn.addEventListener("pointerup",stopSteer);
rightBtn.addEventListener("pointercancel",stopSteer);
rightBtn.addEventListener("pointerleave",stopSteer);


/* BUTTONS */

startBtn.onclick=startGame;
restartBtn.onclick=startGame;


/* INIT */

makeRoad();

</script>
</body>
</html>
