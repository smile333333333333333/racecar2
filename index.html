<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Zombie Highway</title>

<style>
*{box-sizing:border-box;user-select:none}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 font-family:Arial;background:#315c32
}
#game{position:relative;width:100vw;height:100vh;overflow:hidden}
#road{
 position:absolute;left:5%;width:90%;height:100%;
 background:#444;border-left:10px solid #aaa;border-right:10px solid #aaa;
 overflow:hidden
}
.line{
 position:absolute;width:6px;height:90px;background:white;
 opacity:.8
}
.l1{left:33%}.l2{left:66%}

#player{
 position:absolute;width:50px;height:85px;bottom:65px;left:50%;
 transform:translateX(-50%);background:#2474d9;border-radius:9px;
 z-index:20;box-shadow:0 4px 10px #111
}
.window{
 position:absolute;width:36px;height:25px;left:7px;top:9px;
 background:#9dd5e5;border-radius:5px
}
.wheel{
 position:absolute;width:9px;height:25px;background:#111;
 top:20px;border-radius:4px
}
.wheel.a{left:-6px}.wheel.b{right:-6px}

.car,.wreck{
 position:absolute;width:48px;height:82px;
 transform:translateX(-50%);border-radius:8px;
 z-index:10;box-shadow:0 3px 7px #111
}
.car{background:#d33}
.wreck{
 background:#292929;
 transform:translateX(-50%) rotate(-7deg)
}

.zombie{
 position:absolute;width:34px;height:52px;
 transform:translateX(-50%);z-index:15
}
.zhead{
 position:absolute;width:25px;height:25px;left:5px;
 border-radius:50%;background:#719d5a
}
.zbody{
 position:absolute;width:30px;height:29px;left:2px;top:20px;
 border-radius:7px;background:#52694a
}
.eye{
 position:absolute;width:4px;height:4px;top:9px;
 background:#111;border-radius:50%;z-index:2
}
.eye.a{left:7px}.eye.b{right:7px}

.medkit{
 position:absolute;width:30px;height:30px;
 background:white;border:3px solid #222;border-radius:5px;
 color:red;font-size:25px;text-align:center;
 line-height:23px;font-weight:bold;z-index:15
}

#hud{
 position:absolute;top:10px;left:10px;z-index:100;
 color:white;font-weight:bold;text-shadow:2px 2px 4px #000;
 line-height:1.7
}
#health{
 display:inline-block;width:130px;height:17px;
 background:#222;border:2px solid white;border-radius:5px;
 vertical-align:middle;overflow:hidden
}
#healthFill{
 width:100%;height:100%;background:#32c653
}

#blood{
 position:absolute;inset:0;pointer-events:none;
 z-index:80;opacity:0;
 background:
 radial-gradient(circle at 5% 5%,rgba(150,0,0,.8),transparent 18%),
 radial-gradient(circle at 95% 5%,rgba(150,0,0,.8),transparent 18%),
 radial-gradient(circle at 5% 95%,rgba(150,0,0,.8),transparent 18%),
 radial-gradient(circle at 95% 95%,rgba(150,0,0,.8),transparent 18%)
}

#controls{
 position:absolute;bottom:15px;left:50%;
 transform:translateX(-50%);
 display:flex;gap:20px;z-index:100
}
.control{
 width:80px;height:60px;border:2px solid white;
 border-radius:12px;background:#0009;color:white;
 display:flex;align-items:center;justify-content:center;
 font-size:30px;touch-action:none
}

.screen{
 position:absolute;inset:0;z-index:200;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 text-align:center;color:white;background:#000d;padding:25px
}
.screen h1{font-size:38px;margin:0 0 10px}
.screen p{max-width:450px;line-height:1.5}
button{
 padding:14px 30px;border:0;border-radius:8px;
 background:#187ff0;color:white;font-size:19px;font-weight:bold
}
.hidden{display:none!important}
</style>
</head>

<body>

<div id="game">

<div id="road"></div>

<div id="player">
 <div class="window"></div>
 <div class="wheel a"></div>
 <div class="wheel b"></div>
</div>

<div id="hud">
 HEALTH:
 <div id="health">
  <div id="healthFill"></div>
 </div>
 <br>
 DISTANCE: <span id="distance">0</span>m
 <br>
 SCORE: <span id="score">0</span>
</div>

<div id="blood"></div>

<div id="controls">
 <div class="control" id="left">◀</div>
 <div class="control" id="right">▶</div>
</div>

<div id="start" class="screen">
 <h1>ZOMBIE HIGHWAY</h1>
 <p>
 Drive down the highway and survive.
 <br><br>
 Hit zombies for points, avoid wrecks,
 and collect health kits.
 <br><br>
 Your car never slows down.
 </p>
 <button id="startBtn">START</button>
</div>

<div id="over" class="screen hidden">
 <h1>GAME OVER</h1>
 <p>
 Distance: <b><span id="finalDistance">0</span>m</b>
 <br>
 Score: <b><span id="finalScore">0</span></b>
 </p>
 <button id="restart">DRIVE AGAIN</button>
</div>

</div>

<script>

const road=document.getElementById("road");
const player=document.getElementById("player");
const healthFill=document.getElementById("healthFill");
const blood=document.getElementById("blood");
const distanceText=document.getElementById("distance");
const scoreText=document.getElementById("score");

let running=false;
let x=0;
let steer=0;
let health=100;
let distance=0;
let score=0;
let last=0;

let objects=[];
let lines=[];

const moveSpeed=12;

/* ROAD */

function makeRoad(){
 for(let i=0;i<14;i++){
  for(let c of ["l1","l2"]){
   let line=document.createElement("div");
   line.className="line "+c;
   line.style.top=(i*115-120)+"px";
   road.appendChild(line);
   lines.push(line);
  }
 }
}

function moveRoad(d){
 for(let line of lines){
  let y=parseFloat(line.style.top)+moveSpeed*d;
  if(y>innerHeight+100)y=-100;
  line.style.top=y+"px";
 }
}

/* PLAYER */

function movePlayer(d){
 x+=steer*1.8*d;

 let limit=road.clientWidth/2-40;

 if(x>limit)x=limit;
 if(x<-limit)x=-limit;

 player.style.left=`calc(50% + ${x}px)`;
}

/* COLLISION */

function hit(a,b){
 let A=a.getBoundingClientRect();
 let B=b.getBoundingClientRect();

 return !(
  A.right<B.left+5 ||
  A.left>B.right-5 ||
  A.bottom<B.top+5 ||
  A.top>B.bottom-5
 );
}

/* OBJECTS */

function spawn(type){

 let el=document.createElement("div");
 let ox=35+Math.random()*(road.clientWidth-70);

 el.style.left=ox+"px";
 el.style.top="-90px";

 if(type==="zombie"){
  el.className="zombie";

  el.innerHTML=
   '<div class="zhead"></div>'+
   '<div class="zbody"></div>'+
   '<div class="eye a"></div>'+
   '<div class="eye b"></div>';

 }else if(type==="kit"){
  el.className="medkit";
  el.textContent="+";

 }else{
  el.className=type==="wreck"?"wreck":"car";

  el.innerHTML=
   '<div class="window"></div>'+
   '<div class="wheel a"></div>'+
   '<div class="wheel b"></div>';
 }

 road.appendChild(el);

 objects.push({
  el:el,
  type:type,
  y:-90,
  hit:false
 });
}

/* OBJECT MOVEMENT */

function moveObjects(d){

 for(let i=objects.length-1;i>=0;i--){

  let o=objects[i];

  o.y+=moveSpeed*d;
  o.el.style.top=o.y+"px";

  if(hit(player,o.el)){

   if(o.hit){
    continue;
   }

   o.hit=true;

   if(o.type==="zombie"){

    score+=30;

    let level=parseFloat(blood.style.opacity)||0;
    blood.style.opacity=Math.min(.9,level+.15);

    o.el.remove();
    objects.splice(i,1);
    continue;

   }

   if(o.type==="kit"){

    health=Math.min(100,health+25);
    updateHealth();

    score+=20;

    o.el.remove();
    objects.splice(i,1);
    continue;

   }

   if(o.type==="wreck"){
    health-=20;
   }else{
    health-=10;
   }

   updateHealth();

   if(health<=0){
    endGame();
    return;
   }
  }

  if(o.y>innerHeight+120){
   o.el.remove();
   objects.splice(i,1);
  }
 }
}

/* HEALTH */

function updateHealth(){

 healthFill.style.width=health+"%";

 if(health<=25)
  healthFill.style.background="#d22";
 else if(health<=50)
  healthFill.style.background="#e0a52a";
 else
  healthFill.style.background="#32c653";
}

/* SPAWNING */

let spawnTime=0;

function spawnObjects(d){

 spawnTime-=d;

 if(spawnTime<=0){

  let r=Math.random();

  if(r<.55)
   spawn("car");
  else
   spawn("zombie");

  if(Math.random()<.25)
   setTimeout(()=>{
    if(running)spawn("zombie");
   },200);

  spawnTime=40+Math.random()*45;
 }

 if(Math.random()<.008*d)
  spawn("wreck");

 if(Math.random()<.002*d)
  spawn("kit");
}

/* GAME LOOP */

function loop(t){

 if(!running)return;

 if(!last)last=t;

 let d=(t-last)/16.67;

 if(d>3)d=3;

 last=t;

 distance+=moveSpeed*d*.1;

 moveRoad(d);
 movePlayer(d);
 moveObjects(d);
 spawnObjects(d);

 distanceText.textContent=Math.floor(distance);
 scoreText.textContent=Math.floor(score);

 requestAnimationFrame(loop);
}

/* START */

function startGame(){

 for(let o of objects)
  o.el.remove();

 objects=[];

 health=100;
 distance=0;
 score=0;
 x=0;
 steer=0;
 spawnTime=10;
 last=0;

 healthFill.style.width="100%";
 healthFill.style.background="#32c653";
 blood.style.opacity="0";

 player.style.left="50%";

 document.getElementById("start")
  .classList.add("hidden");

 document.getElementById("over")
  .classList.add("hidden");

 running=true;

 requestAnimationFrame(loop);
}

/* GAME OVER */

function endGame(){

 if(!running)return;

 running=false;

 document.getElementById("finalDistance")
  .textContent=Math.floor(distance);

 document.getElementById("finalScore")
  .textContent=Math.floor(score);

 document.getElementById("over")
  .classList.remove("hidden");
}

/* KEYBOARD */

document.addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft"||
    e.key.toLowerCase()==="a")
   steer=-1;

 if(e.key==="ArrowRight"||
    e.key.toLowerCase()==="d")
   steer=1;
});

document.addEventListener("keyup",e=>{

 if(
  e.key==="ArrowLeft"||
  e.key==="ArrowRight"||
  e.key.toLowerCase()==="a"||
  e.key.toLowerCase()==="d"
 )
  steer=0;
});

/* TOUCH */

function press(dir,e){
 e.preventDefault();
 steer=dir;
}

function release(){
 steer=0;
}

document.getElementById("left")
 .addEventListener("pointerdown",e=>press(-1,e));

document.getElementById("right")
 .addEventListener("pointerdown",e=>press(1,e));

for(let id of ["left","right"]){
 let b=document.getElementById(id);
 b.addEventListener("pointerup",release);
 b.addEventListener("pointercancel",release);
 b.addEventListener("pointerleave",release);
}

/* BUTTONS */

document.getElementById("startBtn")
 .onclick=startGame;

document.getElementById("restart")
 .onclick=startGame;

/* INIT */

makeRoad();

</script>

</body>
  </html>
